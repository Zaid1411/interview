services:
  # Backend Web Service
  - type: web
    name: interviewlab-api
    env: node
    plan: starter
    region: oregon
    buildCommand: cd server && npm install && npm run prisma:generate && npm run prisma:deploy && npm run build
    startCommand: cd server && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: interviewlab-frontend
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: interviewlab-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_SECURE
        value: "true"
      - key: CODE_RUNNER_PROVIDER
        value: piston
      - key: PISTON_API_URL
        value: https://emkc.org/api/v2/piston
      - key: EXECUTION_TIMEOUT_MS
        value: "5000"

  # Frontend Static Site
  - type: web
    name: interviewlab-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: interviewlab-api
          property: host

databases:
  # Render PostgreSQL Database
  - name: interviewlab-postgres
    plan: free
    region: oregon
    databaseName: interviewlab
    user: interviewlab_user
